<svg width="16" height="16" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-close-normal">
      <circle cx="8" cy="8" r="7"/>
    </clipPath>
    <!-- Main body: vertical gradient from pixel samples -->
    <linearGradient id="body-close-normal" x1="8" y1="1" x2="8" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9665d"/>
      <stop offset="20%" stop-color="#f55048"/>
      <stop offset="30%" stop-color="#f44f43"/>
      <stop offset="55%" stop-color="#f25e52"/>
      <stop offset="80%" stop-color="#ef6a62"/>
      <stop offset="100%" stop-color="#f3665e"/>
    </linearGradient>
    <!-- Top specular spot: bright highlight at top of sphere -->
    <radialGradient id="st-close-normal" cx="8" cy="2.0" r="3.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffc8bc"/>
      <stop offset="45%"  stop-color="#ffa09a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffa09a" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom specular spot: subtle secondary highlight -->
    <radialGradient id="sb-close-normal" cx="8" cy="13.5" r="2.8" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff9890" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff9890" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Invisible bounding rect (matches original SVG convention) -->
  <rect width="16" height="16" opacity="0"/>
  <!-- Main body -->
  <circle cx="8" cy="8" r="7" fill="url(#body-close-normal)"/>
  <!-- Top specular overlay (clipped to circle) -->
  <rect x="1" y="1" width="14" height="7" fill="url(#st-close-normal)" clip-path="url(#clip-close-normal)"/>
  <!-- Bottom specular overlay (clipped to circle) -->
  <rect x="1" y="8" width="14" height="7" fill="url(#sb-close-normal)" clip-path="url(#clip-close-normal)"/>
  <!-- Icon overlay for hover/active states -->
  
</svg>