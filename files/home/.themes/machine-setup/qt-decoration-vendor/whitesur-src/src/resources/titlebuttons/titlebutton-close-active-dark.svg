<svg width="16" height="16" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-close-active">
      <circle cx="8" cy="8" r="7"/>
    </clipPath>
    <!-- Main body: vertical gradient from pixel samples -->
    <linearGradient id="body-close-active" x1="8" y1="1" x2="8" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#db5a52"/>
      <stop offset="20%" stop-color="#d3443c"/>
      <stop offset="30%" stop-color="#d14039"/>
      <stop offset="55%" stop-color="#d05248"/>
      <stop offset="80%" stop-color="#cd5d55"/>
      <stop offset="100%" stop-color="#d05952"/>
    </linearGradient>
    <!-- Top specular spot: bright highlight at top of sphere -->
    <radialGradient id="st-close-active" cx="8" cy="2.0" r="3.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#e8b0a6"/>
      <stop offset="45%"  stop-color="#e08880" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e08880" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom specular spot: subtle secondary highlight -->
    <radialGradient id="sb-close-active" cx="8" cy="13.5" r="2.8" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#e07f78" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e07f78" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Invisible bounding rect (matches original SVG convention) -->
  <rect width="16" height="16" opacity="0"/>
  <!-- Main body -->
  <circle cx="8" cy="8" r="7" fill="url(#body-close-active)"/>
