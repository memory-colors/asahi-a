<svg width="16" height="16" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-unmaximize-active">
      <circle cx="8" cy="8" r="7"/>
    </clipPath>
    <!-- Main body: vertical gradient from pixel samples -->
    <linearGradient id="body-unmaximize-active" x1="8" y1="1" x2="8" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30aa00"/>
      <stop offset="15%" stop-color="#14a800"/>
      <stop offset="25%" stop-color="#00a400"/>
      <stop offset="50%" stop-color="#1ca700"/>
      <stop offset="68%" stop-color="#35a81c"/>
      <stop offset="80%" stop-color="#46ac31"/>
      <stop offset="100%" stop-color="#46ac31"/>
    </linearGradient>
    <!-- Top specular spot: bright highlight at top of sphere -->
    <radialGradient id="st-unmaximize-active" cx="8" cy="2.0" r="3.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#98d878"/>
      <stop offset="45%"  stop-color="#6ed050" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6ed050" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom specular spot: subtle secondary highlight -->
    <radialGradient id="sb-unmaximize-active" cx="8" cy="13.5" r="2.8" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#68d056" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#68d056" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Invisible bounding rect (matches original SVG convention) -->
  <rect width="16" height="16" opacity="0"/>
  <!-- Main body -->
  <circle cx="8" cy="8" r="7" fill="url(#body-unmaximize-active)"/>
  <!-- Top specular overlay (clipped to circle) -->
  <rect x="1" y="1" width="14" height="7" fill="url(#st-unmaximize-active)" clip-path="url(#clip-unmaximize-active)"/>
  <!-- Bottom specular overlay (clipped to circle) -->
  <rect x="1" y="8" width="14" height="7" fill="url(#sb-unmaximize-active)" clip-path="url(#clip-unmaximize-active)"/>
  <!-- Icon overlay for hover/active states -->
  <path d="m8.0254 3.4141v3.5859c0 0.41552 0.58448 1 1 1h3.5859zm-4.6367 4.5859 4.5859 4.5859v-3.5859c0-0.41552-0.58448-1-1-1z" opacity=".5"/>
</svg>