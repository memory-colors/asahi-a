# fm-tweaks.conf - the single source of truth for the Thunar / SMPlayer / Qt app look. Edit here, or: fm-tweaks set <key> <value>.
# `fm-tweaks apply` regenerates every output (Knomadic rows do it via fm-color.sh). Restart Thunar / the app to see changes.

[colors]
sidebar      = #35353f # Places panel background
view         = #1c1c20 # main file view background; also toolbar/location bar, status bar, column-header row
accent       = #483676 # selection fill, hover tint, focus ring, context-menu highlight
window       = #2c2c34 # menus (Thunar), Qt window background
tooltip      = #2c2c34 # tooltips, context menus, Open With dialog (shared.qss)

[overrides]
statusbar    =  # status bar background (empty = follow view)
sidebarhl    = #35353f # selected row in the Places sidebar - Thunar only (empty = follow accent)
button       = #1c1c20  # column-header (Name/Size) bar + Thunar titlebar (empty = view shifted by D_BUTTON)
headertext   = #7980a6 # Thunar column-header text (Name / Size / Date row) (empty = follow text)
rowhover     = #202026 # Thunar hovered row (file list only) fill (empty = the accent at 50% over what is behind)
foldercolor  = #b9b6c2 # folder icons (Thunar and every GTK app on the fm-folders icon theme): colour of the front panel; the back layer is 24 darker and the paper 27 lighter
menubar      = #1c1c20 # Thunar menu bar background (empty = follow the Menu/tooltip colour); its text follows statustext
titlebar     = #1c1c20  # Thunar titlebar (empty = follow button)

[text]
text         = #d6d3e0 # general text: file names + details, Qt app text
sidebartext  = #d6d3e0 # Places panel text
buttontext   = #dddee6 # column-header row + menu item text
statustext   = #991980 # status bar labels (message, item count, zoom, progress)
hltext       = #f4f1ff  # text on highlighted (selected / hovered menu) rows - Thunar only

[thunar]
inactivetext = 0.53      # Thunar: opacity of the inactive split pane (lower = dimmer)

[smplayer]
menubar_hidden = true  # SMPlayer: hide the menu bar until the toggle key is pressed
menubar_key  = Ctrl+M # SMPlayer: key that shows/hides the menu bar (free it in SMPlayer first; empty = none)
hide_dock_titles = true  # SMPlayer: hide the "Untitled playlist" title strip above the playlist
hide_logo    = true  # SMPlayer: no logo in the empty video window
hide_playlist_toolbar = true  # SMPlayer: hide the playlist button row (load/save/add/remove/play/shuffle/search)
smfield      = #0d0d0f # SMPlayer text fields, buttons, table headers, scrollbar + slider grooves (empty = follow button)
smcontent    = #131317 # SMPlayer playlist body, Preferences page list, log and text areas (empty = follow view)
smtext       = #cac8d4 # SMPlayer text, incl. buttons and menu items (empty = follow text)
smhltext     = #e3e0ee # SMPlayer text on highlighted rows (empty = follow hltext)
smheadertext = #626485 # SMPlayer table / column-header text (empty = follow smtext, else buttontext)
smstatustext = #992e84 # SMPlayer status bar text (empty = follow statustext)
smfloat      = #2a2a33 # SMPlayer floating control bar background (empty = follow smpanel)
smcontrolicon = #d6d3e0 # SMPlayer main control bar icons (empty = icons stay as shipped)
smcontrolknob = #d6d3e0 # SMPlayer main control bar slider knobs (empty = follow smtext)
smcontrol    = #222228  # SMPlayer main control bar background (empty = follow smpanel)
smfloatknob  = #d6d3e0 # SMPlayer floating control bar slider knobs (empty = follow smtext)
smfloaticon  = #d6d3e0 # SMPlayer floating control bar icons (empty = icons stay as shipped)
smstatus     = #0d0d0f # SMPlayer status bar background (empty = follow statusbar)
smplaylisttext = #9f9fb3 # SMPlayer playlist track names (empty = follow smtext)
smfloattext  = #d6d3e0  # SMPlayer floating control bar text (empty = follow smtext)
smmenuhltext = #f4f1ff  # SMPlayer text on the highlighted menu item (empty = follow smhltext)
smdisabled   = #9b98ad  # SMPlayer greyed-out text (empty = smtext minus 70)

