# fm-tweaks.conf - the single source of truth for the Thunar / SMPlayer / Qt app look. Edit here, or: fm-tweaks set <key> <value>.
# `fm-tweaks apply` regenerates every output (Knomadic rows do it via fm-color.sh). Restart Thunar / the app to see changes.

[colors]
sidebar      = #383840   # Places panel background
view         = #1c1c20 # main file view background; also toolbar/location bar, status bar, column-header row
accent       = #483676 # selection fill, hover tint, focus ring, context-menu highlight
window       = #2c2c34 # menus (Thunar), Qt window background
tooltip      = #2c2c34 # tooltips, context menus, Open With dialog (shared.qss)

[overrides]
statusbar    =  # status bar background (empty = follow view)
sidebarhl    = #383840 # selected row in the Places sidebar - Thunar only (empty = follow accent)
button       = #1c1c20  # column-header (Name/Size) bar + Thunar titlebar (empty = view shifted by D_BUTTON)

[text]
text         = #dddee6 # general text: file names + details, Qt app text
sidebartext  = #dddee6 # Places panel text
buttontext   = #dddee6 # column-header row + menu item text
statustext   = #4e4e5a # status bar labels (message, item count, zoom, progress)

[thunar]
inactivetext = 0.53      # Thunar: opacity of the inactive split pane (lower = dimmer)

[smplayer]
menubar_hidden = true  # SMPlayer: hide the menu bar until the toggle key is pressed
menubar_key  = Ctrl+M # SMPlayer: key that shows/hides the menu bar (free it in SMPlayer first; empty = none)
hide_dock_titles = true  # SMPlayer: hide the "Untitled playlist" title strip above the playlist
hide_logo    = true  # SMPlayer: no logo in the empty video window
hide_playlist_toolbar = true  # SMPlayer: hide the playlist button row (load/save/add/remove/play/shuffle/search)
smfield      = #121215 # SMPlayer text fields, buttons, table headers, scrollbar + slider grooves (empty = follow button)
smcontent    = #161619  # SMPlayer playlist body, Preferences page list, log and text areas (empty = follow view)
smtext       = #bdbfd2 # SMPlayer text, incl. buttons and menu items (empty = follow text)

