# dolphin-tweaks.conf - the single source of truth for the Dolphin look. Edit here, or: dolphin-tweaks set <key> <value>.
# `dolphin-tweaks apply` regenerates the QSS, color scheme and runtime file; the launcher does it at every start. Restart Dolphin to see changes.

[colors]
sidebar      = #383840   # Places panel background
view         = #1c1c20   # main file view background; also derives status bar, path bar, column-header row, zoom-slider track + handle
accent       = #483676 # selection fill, hover tint, focus ring, zoom-slider fill, context-menu highlight, disk bars
window       = #2c2c34 # Folders tree, Information panel, toolbar / menu bar
tooltip      = #2c2c34 # tooltips, context menus, Open With dialog (shared.qss)

[overrides]
pathbar      =           # path/breadcrumb bar background (empty = follow view)
statusbar    =           # status bar background (empty = follow view)
sidebarhl    = #383840 # selected row in the Places sidebar - Thunar only (empty = follow accent)
button       = #1c1c20  # column-header (Name/Size) bar + Thunar titlebar (empty = view shifted by D_BUTTON; Dolphin derives its header row the same way)

[text]
text         = #dddee6 # general Dolphin text: file names + details, Folders tree, Information panel (Dolphin process only)
sidebartext  = #dddee6 # Places panel text
buttontext   = #dddee6 # column-header row + menu item text
urltext      = #72727e # path/breadcrumb bar text
statustext   = #828295   # status bar labels (message, item count, zoom, progress)
disktext     = #828295   # disk-usage text ("x GiB free")

[shim]
arrowgap     = 4         # px the folder icon + name are pulled toward the expander arrow
inactivetext = 0.53      # share of text/icon strength kept in the inactive split pane (lower = dimmer)
edgeradius   = 5 # rounded corners (px) on the end of a row highlight that is cut off by the view edge in a narrow pane / split view; 0 = stock; Breeze's own corner is ~5

[smplayer]
menubar_hidden = true  # SMPlayer: hide the menu bar until the toggle key is pressed
menubar_key  = Ctrl+M # SMPlayer: key that shows/hides the menu bar (free it in SMPlayer first; empty = none)
hide_dock_titles = true  # SMPlayer: hide the "Untitled playlist" title strip above the playlist
hide_logo    = true  # SMPlayer: no logo in the empty video window
hide_playlist_toolbar = true  # SMPlayer: hide the playlist button row (load/save/add/remove/play/shuffle/search)
smfield      = #121215 # SMPlayer text fields, buttons, table headers, scrollbar + slider grooves (empty = follow button)
smcontent    = #161619  # SMPlayer playlist body, Preferences page list, log and text areas (empty = follow view)
smtext       = #bdbfd2 # SMPlayer text, incl. buttons and menu items (empty = follow text)

