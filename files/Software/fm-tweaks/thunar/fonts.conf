<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- thunar-fm only: render every bold request as regular (Thunar hardcodes bold for the Places/Devices headings; CSS cannot override it) -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="weight" mode="assign" binding="strong"><const>regular</const></edit>
  </match>
  <!-- 2026-10-24: unhinted glyph outlines for Thunar: slight/auto hinting snapped the stems of the static SF Pro faces unevenly (thick P and l, lopsided 0) at the 12pt status bar size on a 2x screen -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
